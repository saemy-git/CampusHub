# Render Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: campushub
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd backend && npm install
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: "*"
